<!-- navbar.html -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

<style>
  #main-navbar { font-family: 'DM Sans', sans-serif; }

  /* Teal bottom border always visible — clear separation from hero */
  #main-navbar {
    border-bottom: 1.5px solid rgba(20, 184, 166, 0.35) !important;
  }

  .nav-link { position: relative; padding-bottom: 3px; }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -5px; left: 0;
    width: 0; height: 2px;
    background: #14b8a6;
    border-radius: 9999px;
    transition: width 0.3s ease;
  }
  .nav-link:hover::after  { width: 100%; }
  .nav-link.active        { color: #14b8a6; }
  .nav-link.active::after { width: 100%; }

  #main-navbar.scrolled {
    background: rgba(5, 9, 18, 0.97) !important;
    backdrop-filter: blur(16px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(20,184,166,0.3);
  }
</style>

<nav
  id="main-navbar"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  style="background: rgba(4, 8, 18, 0.92); backdrop-filter: blur(12px);"
>
  <div class="max-w-7xl mx-auto px-6 md:px-16 flex items-center justify-between h-[68px]">

    <!-- Brand -->
    <a href="#home" onclick="smoothNav(event,'home')"
       class="text-white font-bold text-xl tracking-tight hover:text-teal-300 transition-colors duration-200"
       style="font-family:'Playfair Display',serif;">
      Noushin<span class="text-teal-400">.</span>
    </a>

    <!-- Desktop links -->
    <ul class="hidden md:flex items-center gap-10">
      <li><a href="#home"     onclick="smoothNav(event,'home')"     class="nav-link active text-sm font-medium text-gray-300 hover:text-white transition-colors">Home</a></li>
      <li><a href="#about"    onclick="smoothNav(event,'about')"    class="nav-link        text-sm font-medium text-gray-300 hover:text-white transition-colors">About</a></li>
      <li><a href="#projects" onclick="smoothNav(event,'projects')" class="nav-link        text-sm font-medium text-gray-300 hover:text-white transition-colors">Projects</a></li>
      <li><a href="#contact"  onclick="smoothNav(event,'contact')"  class="nav-link        text-sm font-medium text-gray-300 hover:text-white transition-colors">Contact</a></li>
    </ul>

    <!-- Hamburger (mobile) -->
    <button id="menu-toggle" onclick="toggleMenu()"
            class="md:hidden text-gray-300 hover:text-white focus:outline-none">
      <svg id="icon-open"  class="w-6 h-6"        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden md:hidden"
       style="background:rgba(4,8,18,0.99); border-top:1px solid rgba(20,184,166,0.15);">
    <div class="px-6 py-3 flex flex-col">
      <a href="#home"     onclick="smoothNav(event,'home');closeMenu()"     class="py-3 text-sm text-gray-300 border-b border-white/5 hover:text-teal-300 transition-colors">Home</a>
      <a href="#about"    onclick="smoothNav(event,'about');closeMenu()"    class="py-3 text-sm text-gray-300 border-b border-white/5 hover:text-teal-300 transition-colors">About</a>
      <a href="#projects" onclick="smoothNav(event,'projects');closeMenu()" class="py-3 text-sm text-gray-300 border-b border-white/5 hover:text-teal-300 transition-colors">Projects</a>
      <a href="#contact"  onclick="smoothNav(event,'contact');closeMenu()"  class="py-3 text-sm text-gray-300 hover:text-teal-300 transition-colors">Contact</a>
    </div>
  </div>
</nav>

<script>
  function smoothNav(e, id) {
    e.preventDefault();
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  }

  function toggleMenu() {
    var m = document.getElementById('mobile-menu');
    var o = document.getElementById('icon-open');
    var c = document.getElementById('icon-close');
    var hidden = m.classList.contains('hidden');
    m.classList.toggle('hidden', !hidden);
    o.classList.toggle('hidden',  hidden);
    c.classList.toggle('hidden', !hidden);
  }

  function closeMenu() {
    document.getElementById('mobile-menu').classList.add('hidden');
    document.getElementById('icon-open').classList.remove('hidden');
    document.getElementById('icon-close').classList.add('hidden');
  }

  window.addEventListener('scroll', function () {
    document.getElementById('main-navbar')
      .classList.toggle('scrolled', window.scrollY > 20);
  });

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        document.querySelectorAll('.nav-link').forEach(function (link) {
          link.classList.toggle('active',
            link.getAttribute('href') === '#' + entry.target.id);
        });
      }
    });
  }, { threshold: 0.4 });

  ['home','about','projects','contact'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) observer.observe(el);
  });
</script>
