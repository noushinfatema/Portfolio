<!-- hero.html -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-badge { animation: fadeUp 0.7s ease 0.05s both; }
  .hero-greeting { animation: fadeUp 0.7s ease 0.15s both; }
  .hero-name { animation: fadeUp 0.7s ease 0.25s both; }
  .hero-role { animation: fadeUp 0.7s ease 0.35s both; }
  .hero-desc { animation: fadeUp 0.7s ease 0.45s both; }
  .hero-btns { animation: fadeUp 0.7s ease 0.55s both; }
  .hero-social { animation: fadeUp 0.7s ease 0.65s both; }

  .name-gradient {
    background: linear-gradient(130deg, #ffffff 10%, #99f6e4 55%, #14b8a6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .btn-primary {
    background: linear-gradient(135deg,#14b8a6,#0d9488);
    box-shadow: 0 8px 28px rgba(20,184,166,0.25);
    transition: all 0.3s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(20,184,166,0.35);
  }

  .btn-ghost {
    border:1.5px solid rgba(255,255,255,0.15);
    transition: all 0.3s ease;
  }
  .btn-ghost:hover {
    border-color:#14b8a6;
    background:rgba(20,184,166,0.08);
    transform:translateY(-2px);
  }

  /* IMAGE CARD (clean, professional) */
  .photo-card {
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .photo-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 60px rgba(0,0,0,0.65);
  }

  #home { font-family:'DM Sans',sans-serif; }
</style>

<section
  id="home"
  class="relative min-h-screen flex items-center px-4 sm:px-6 md:px-16 pt-24 pb-16 overflow-hidden"
  style="background:#060e1e;"
>

  <div class="relative z-10 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-5 lg:gap-8 items-center">

    <!-- LEFT SIDE (TEXT) -->
    <div class="flex flex-col">

      <div class="hero-badge self-start inline-flex items-center gap-2 px-4 py-2 mb-7 rounded-full border border-teal-500/25 bg-teal-500/10">
        <span class="w-2 h-2 rounded-full bg-teal-400"></span>
        <span class="text-teal-300 text-xs font-mono tracking-widest uppercase">Available for work</span>
      </div>

      <p class="hero-greeting text-gray-400 text-lg mb-2">
        Hello, I am
      </p>

      <h1 class="hero-name name-gradient font-black leading-[1.05] mb-5"
          style="font-family:'Playfair Display',serif; font-size:clamp(2.4rem,8vw,5.2rem);">
        Noushin Fatema
      </h1>

      <div class="hero-role flex items-center gap-3 mb-8">
        <div class="h-px w-8 bg-teal-500/50"></div>
        <span class="text-teal-300 text-lg font-mono uppercase tracking-widest">
          Web Developer
        </span>
        <div class="h-px w-8 bg-teal-500/50"></div>
      </div>

      <div class="hero-desc mb-10 p-7 rounded-2xl max-w-lg"
           style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);">
        <p class="text-gray-300 text-base leading-relaxed">
          I am a passionate web developer focused on interactive responsive websites using HTML, Tailwind CSS and JavaScript.

      </div>

      <div class="hero-btns flex flex-col sm:flex-row gap-4">

        <a href="#contact"

          Contact Me

        <button onclick="downloadCV()"

      </div>

      <div class="hero-social flex items-center gap-5 mt-10">
        <span class="text-gray-600 text-xs font-mono uppercase">Find me on</span>

        <a

              .092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688
              -.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004
              1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651
              .64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855

          </svg>
          </a>

        <a
            href="https://www.linkedin.com/in/noushin-fatema-22aa77247/"
            target="_blank"
            class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-teal-500 hover:text-white transition duration-300"
          >
            in
          </a>
      </div>

    </div>

    <!-- RIGHT SIDE (IMAGE) -->
    <div class="flex justify-center md:justify-end">

      <div class="photo-card relative rounded-2xl overflow-hidden bg-slate-900
        w-[260px] sm:w-[340px] md:w-[400px]
        h-[320px] sm:h-[420px] md:h-[520px]">

        <img
          src="./profile.jpg"
          alt="profile"
          class="w-full h-full object-cover object-top"
        />

        <div class="absolute inset-0 pointer-events-none"
          style="background:linear-gradient(to top, rgba(8,13,24,0.25), transparent);">
        </div>

      </div>

    </div>

  </div>
</section>
